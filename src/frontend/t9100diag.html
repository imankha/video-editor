  player-detection boxes align with the actual rendered video ONLY when the

  for the Playwright real-browser verification (jsdom cannot measure layout, and
  a real Focus->Overlay export is infeasible in this container -- Modal disabled,
  the dev-login account has zero seeded projects; same constraint T5676's harness
  documents).
-->
