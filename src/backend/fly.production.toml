app = "reel-ballers-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  APP_ENV = "production"
  DEBUG = "false"
  CLEAR_PENDING_JOBS_ON_STARTUP = "false"
  MODAL_ENABLED = "true"
  CORS_ORIGINS = "https://app.reelballers.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

kill_signal = "SIGTERM"
kill_timeout = 30

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # T7090 stopgap: bumped 1024 -> 2048 while download-time compose is moved off
  # this box to Modal (Phase 3). The intro-card ffmpeg render peaked ~1.7GB on a
  # 1GB box and was OOM-killed, silently dropping the intro from downloads.
  # Revert candidate once compose no longer runs local ffmpeg here.
  memory_mb = 2048
