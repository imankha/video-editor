app = "reel-ballers-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  APP_ENV = "production"
  DEBUG = "false"
  CLEAR_PENDING_JOBS_ON_STARTUP = "false"
  MODAL_ENABLED = "true"
  CORS_ORIGINS = "https://app.reelballers.com"
  # T14380: local per-user DB cache cap. Derivation (prod measured 2026-11-02) is in
  # docs/plans/tasks/T14380-local-user-db-lru-eviction.md; re-derive if the rootfs changes.
  DB_CACHE_HIGH_WATER_BYTES = "4000000000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  # T14110: the app is single-machine only (in-process locks, version caches, background
  # loops with no leader election) until the Session Scaling epic. Autostart only wakes
  # existing machines; deploy_production.sh deploys with --ha=false and refuses a count != 1.

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

kill_signal = "SIGTERM"
kill_timeout = 30

[[vm]]
  # T14110: dedicated CPU. One uvicorn process also runs ffmpeg stamping, the sweep's
  # local auto-export and the compose fallback; a shared vCPU's burst quota drains
  # under a sustained evening peak and everything slows at once. 4 GB keeps headroom
  # over the T7090 intro-card render (~1.7 GB peak, OOM-killed on a 1 GB box).
  # Staging mirrors this block so load tests stay representative.
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 4096
