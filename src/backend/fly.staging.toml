app = "reel-ballers-api-staging"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "staging"
  APP_ENV = "staging"
  DEBUG = "false"
  CLEAR_PENDING_JOBS_ON_STARTUP = "false"
  MODAL_ENABLED = "true"
  CORS_ORIGINS = "https://reel-ballers-staging.pages.dev"
  # T15450: staging's frontend (pages.dev) and backend (fly.dev) are cross-site, so
  # app/utils/cookies.py needs its SameSite=None;Secure;Partitioned branch -- the
  # SameSite=Lax default is dropped by Safari on cross-site fetch/XHR, which broke
  # sign-in surviving a reload. Prod stays on the Lax default since it is same-site.
  SECURE_COOKIES = "true"
  # T14380: same rootfs as prod (8.35 GB), so the same cap. See fly.production.toml.
  DB_CACHE_HIGH_WATER_BYTES = "4000000000"

# T13260: Postgres has no per-user JIT seam, so run its migrations before the new
# version takes traffic. Nonzero exit (migration error) aborts the release.
[deploy]
  release_command = "python -c 'import sys; from app.migrations import release_migrate_postgres; sys.exit(release_migrate_postgres())'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

kill_signal = "SIGTERM"
kill_timeout = 30

[[vm]]
  # T14110: dedicated CPU. One uvicorn process also runs ffmpeg stamping, the sweep's
  # local auto-export and the compose fallback; a shared vCPU's burst quota drains
  # under a sustained evening peak and everything slows at once. 4 GB keeps headroom
  # over the T7090 intro-card render (~1.7 GB peak, OOM-killed on a 1 GB box).
  # Staging mirrors this block so load tests stay representative.
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 4096
