# Ruff configuration for video-editor backend
target-version = "py311"
line-length = 120

[lint]
# Enable common rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "RUF",   # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults (common in FastAPI)
    "B905",   # `zip()` without `strict=` (too noisy)
    "SIM108", # Use ternary operator (readability preference)
    "SIM105", # contextlib.suppress (readability preference; same rationale as SIM108)
    "UP007",  # Use X | Y for union types (keep Optional for clarity)
    "UP042",  # str+Enum -> StrEnum: `str, Enum` is the documented pattern (see backend type-safety skill)
    "RUF012", # Mutable class variables (false positives with SQLAlchemy/Pydantic)
]

# Exclude auto-generated and third-party code
exclude = [
    ".venv",
    "__pycache__",
    "*.pyc",
    "migrations",
    "alembic",
]

[lint.per-file-ignores]
# Tests can use assert, magic values, etc.
"tests/**/*.py" = ["B011", "S101"]
# Modal functions have different patterns
"app/modal_functions/**/*.py" = ["E402"]
# main.py intentionally orders imports after logging config + conditional/deferred
# imports for app init (same import-after-code pattern as modal functions).
"app/main.py" = ["E402"]
# T6450: 15 pre-existing errors discovered while fixing an unrelated crash in this
# file (sqlite3.Row .get() in resolve_clip_source) -- all predate the T4790/T5020
# ruff freeze, none touched by that fix. B904/B030 are manual-review exception-
# chaining nits (not autofixable) -- scoping a real cleanup is a separate task, not
# bundled into an urgent bug fix. B023 (4x, lines ~2194-2196) checked by hand: the
# closures are `await asyncio.to_thread(...)`'d synchronously within the SAME loop
# iteration before the loop variable next changes -- a ruff false positive for this
# immediate-await pattern, not a real late-binding bug. This only REMOVES these 15
# from the whole-app backlog count (still well under the 239 cap); nothing here
# claims the RUF013/RUF003/RUF006 style nits are fixed.
"app/routers/export/multi_clip.py" = ["RUF013", "RUF003", "B030", "B904", "RUF006", "B023"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
