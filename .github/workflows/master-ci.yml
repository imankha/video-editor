name: Master CI

# Full-suite sweep of master on every merge. Branch CI verifies each feature
# branch against ITS OWN base pre-merge; this workflow verifies the COMBINED
# state after merges land (two independently-green branches can still conflict
# semantically). Non-blocking by design: staging auto-deploys in parallel and
# staging IS the test phase -- a red run here is a fast flag, not a deploy gate.
# T13710: every Branch CI job runs here unconditionally (scripts/test_ci_policy.py pins
# it), so cross-PR breaks in instructions, harness and the landing build surface too.
# A cancelled run is covered by the next one, which sweeps the cumulative state.
# Known pre-existing failures are catalogued in docs/testing/known-failures.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: master-ci
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_ci_policy.py
      - run: python scripts/test_ci_vitest_selection.py
      - run: python scripts/test_ci_testmon_selection.py
      - name: Testmon baseline helpers need pytest + coverage (versions match src/backend)
        run: python -m pip install pytest==8.3.4 pytest-testmon==2.2.0
      - run: python scripts/test_testmon_baseline.py
      - run: python scripts/test_landing_gate.py
      - run: python scripts/test_check_doc_drift.py
      - run: python scripts/test_split_pytest.py
      - run: python scripts/test_split_pytest.py
      - name: Doc drift ratchet (dead references must not exceed the baseline)
        run: python scripts/check_doc_drift.py

  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/audit-agent-instructions.py
      - run: python scripts/validate_agent_instructions.py
      - run: python scripts/test_audit_agent_instructions.py
      - run: python scripts/test_validate_agent_instructions.py

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax floor for hand-run scripts, hooks and skill helpers (same as branch-ci.yml)
        run: |
          git ls-files -z 'scripts/*.py' '.claude/skills/*.py' ':!scripts/shrink-tool/*' ':!scripts/shrink-spike/*' | xargs -0 -r python -m py_compile
          git ls-files -z '*.sh' '.githooks/*' ':!src/*' | xargs -0 -r -n1 bash -n
          git ls-files -z '.claude/hooks/*.cjs' 'scripts/*.js' 'scripts/*.mjs' ':!scripts/shrink-tool/*' ':!scripts/shrink-spike/*' | xargs -0 -r -n1 node --check
      - name: Install the one third-party import the harness tests need (reset_all_accounts.py)
        run: python -m pip install psycopg2-binary==2.9.10
      - run: python scripts/test_dotask_cli.py
      - run: python scripts/test_dotask_evidence.py
      - run: python scripts/test_dotask_expert_matrix.py
      - run: python scripts/test_wave_profile.py
      - run: python scripts/test_reset_all_accounts.py
      - run: python scripts/test_lint_hook.py
      - run: bash scripts/test_task_run.sh

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  shrink:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/shrink-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/shrink-tool/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: ESLint regression gate (merged state must not regrow the backlog)
        # Same baseline as branch-ci.yml -- keep the two numbers in sync.
        run: npx eslint src --max-warnings 360
      - name: Viewport-unit gate (T4930)
        working-directory: .
        run: node scripts/check-viewport-units.mjs
      - name: Media-api-base gate (T5890)
        working-directory: .
        run: node scripts/check-media-api-base.mjs
      - name: Unit tests (vitest, retry absorbs known flakes)
        run: npx vitest run --retry=2

  # T13964: same shape as branch-ci.yml -- backend-lint once, pytest in 4 duration-balanced shards,
  # and this aggregate verifying every test file ran exactly once. It also merges the shards'
  # junit timings into a fresh tests/.test_durations.json artifact: when the shards drift out of
  # balance, download it and commit it by hand (no auto-commit).
  backend:
    needs: [backend-lint, backend-shard]
    runs-on: ubuntu-latest
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint and every shard succeeded
        env:
          LINT_RESULT: ${{ needs.backend-lint.result }}
          SHARD_RESULT: ${{ needs.backend-shard.result }}
        run: |
          echo "backend-lint: $LINT_RESULT, backend-shard: $SHARD_RESULT"
          if [ "$LINT_RESULT" != success ] || [ "$SHARD_RESULT" != success ]; then
            echo "::error::backend needs backend-lint and every backend-shard to succeed"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-report-*
          path: shard-reports
      - name: Every shard reported and every test file ran exactly once
        working-directory: src/backend
        run: python ../../scripts/split_pytest.py verify --shards "$SHARDS" --reports-dir ../../shard-reports tests/test_*.py
      - name: Fresh per-file durations from the shards' junit reports
        run: python scripts/split_pytest.py durations --output test_durations.json shard-reports/*/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: test_durations.json
          if-no-files-found: error

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      APP_ENV: dev
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - name: Install deps (the import check needs the prod requirements)
        run: pip install -r requirements.prod.txt ruff
      - name: Ruff regression gate (merged state must not regrow the backlog)
        # Same baseline as branch-ci.yml -- keep the two numbers in sync.
        run: |
          OUT=$(ruff check app --output-format=concise || true)
          COUNT=$(printf '%s\n' "$OUT" | grep -c '^app/' || true)
          echo "ruff error count: $COUNT (baseline 239)"
          if [ "$COUNT" -gt 239 ]; then
            echo "::error::ruff errors grew past the baseline of 239 (now $COUNT)."
            exit 1
          fi
      - name: Import check
        run: python -c "from app.main import app"

  backend-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      APP_ENV: dev
      PYTHONUTF8: '1'
      SHARD: ${{ matrix.shard }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - name: Install ffmpeg (metadata tests use ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install deps
        run: pip install -r requirements.prod.txt -r requirements.test.txt
      - name: Pytest, this shard's files (deselects = docs/testing/known-failures.md)
        # selection mirrors run_tests.py (canonical suite); see branch-ci.yml
        run: |
          mkdir -p shard
          MINE=$(python ../../scripts/split_pytest.py shard --index "$SHARD" --shards "$SHARDS" --durations tests/.test_durations.json --mode full --report shard/shard-report.json tests/test_*.py)
          echo "Shard $SHARD/$SHARDS runs: $MINE"
          python -m pytest $MINE --tb=short --capture=sys --junitxml=shard/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-shard-report-${{ matrix.shard }}
          path: src/backend/shard/
          if-no-files-found: error

  testmon-baseline:
    # T13961/T13962: the coverage-instrumented full run that Branch CI's testmon selection restores.
    # One job, not sharded: testmon data from separate processes does not merge. Retired by T13968.
    # T13961: the baseline's fingerprint includes the exact Python version, so it is pinned (not '3.11').
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      APP_ENV: dev
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - name: Install ffmpeg (metadata tests use ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install deps
        run: pip install -r requirements.prod.txt -r requirements.test.txt ruff
      - name: Pytest + testmon baseline (deselects = docs/testing/known-failures.md)
        # selection mirrors run_tests.py (canonical suite); see branch-ci.yml
        # T13961: a fresh --testmon run over the tests/test_*.py FILE LIST (a directory lets testmon skip
        # collection and turn an import error into exit 0). The plugin keeps coverage from restarting
        # every 250 tests and records which test files spawn processes (always_run.json).
        run: |
          rm -f .testmondata*
          PYTHONPATH=../../scripts python -m pytest tests/test_*.py --tb=short --capture=sys --testmon \
            -p testmon_baseline_plugin --always-run-json always_run.json
      - name: Record import-time lines and checkpoint the baseline
        # testmon leaves its data in the SQLite WAL; fold it into .testmondata or the cache saves an empty DB.
        run: |
          python ../../scripts/testmon_import_lines.py import_lines.json tests/test_*.py
          python -c "import sqlite3; c = sqlite3.connect('.testmondata'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()"
          echo "$GITHUB_SHA" > .testmondata-sha
          ls -l .testmondata always_run.json import_lines.json
      - name: Save the testmon baseline for Branch CI (only reached when the suite is green)
        uses: actions/cache/save@v4
        with:
          path: |
            src/backend/.testmondata
            src/backend/.testmondata-sha
            src/backend/always_run.json
            src/backend/import_lines.json
          key: testmon-${{ github.sha }}
