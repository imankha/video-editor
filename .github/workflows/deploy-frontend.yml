name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - 'src/frontend/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      # Tbug40p: fetch-depth 0 so vite.config.js's `git rev-list --count HEAD`
      # (the __APP_BUILD__ define) returns the true monotonic build number — a
      # shallow clone would bake in 1 and never match the backend's number.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: src/frontend

      - run: npm run build
        working-directory: src/frontend
        env:
          VITE_API_BASE: https://reel-ballers-api-staging.fly.dev
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # T4940: staging Stripe publishable key. A pk_ is not secret, but no keys
          # are hardcoded in workflows (standard). OPERATOR: create the repo secret
          # VITE_STRIPE_PUBLIC_KEY_STAGING with the staging pk_test_ value before the
          # next frontend deploy, or this build ships without a Stripe key.
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY_STAGING }}

      - run: npx wrangler pages deploy dist --project-name=reel-ballers-staging --branch=master
        working-directory: src/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
