name: Deploy Frontend

on:
  push:
    branches: [master]
    # T6220: UNION of both halves' paths, identical in deploy-frontend.yml and
    # deploy-backend.yml. The invariant that matters is "bundle build == backend
    # build", not "always deploy": a commit touching EITHER half deploys BOTH
    # halves from the same commit, so the two numbers move together. A push
    # touching neither path deploys NEITHER half, so both stay at the same
    # (older, still-equal) number -- still correct, with zero redundant CI for
    # the docs(plan)-only commits this repo makes constantly.
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
  # T6220 known hole (documented, not fixed): a manual workflow_dispatch run
  # still fires ONLY this workflow, so a deliberate single-half manual dispatch
  # breaks lockstep on purpose. That is an operator's call, not a bug.
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      # Tbug40p: fetch-depth 0 so vite.config.js's `git rev-list --count HEAD`
      # (the __APP_BUILD__ define) returns the true monotonic build number — a
      # shallow clone would bake in 1 and never match the backend's number.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: src/frontend

      - run: npm run build
        working-directory: src/frontend
        env:
          VITE_API_BASE: https://reel-ballers-api-staging.fly.dev
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # T4940: staging Stripe publishable key. A pk_ is not secret, but no keys
          # are hardcoded in workflows (standard). OPERATOR: create the repo secret
          # VITE_STRIPE_PUBLIC_KEY_STAGING with the staging pk_test_ value before the
          # next frontend deploy, or this build ships without a Stripe key.
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY_STAGING }}

      - run: npx wrangler pages deploy dist --project-name=reel-ballers-staging --branch=master
        working-directory: src/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # T6220: assert this deploy landed in lockstep with the backend's. Running
      # from just this job is enough -- the script POLLS, so it covers the
      # concurrent deploy-backend.yml job too (both fire from the same push).
      - name: Verify frontend/backend build lockstep
        run: |
          bash scripts/verify-build-lockstep.sh \
            --frontend-url https://reel-ballers-staging.pages.dev \
            --backend-url https://reel-ballers-api-staging.fly.dev/api/version
