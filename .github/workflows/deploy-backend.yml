name: Deploy Backend

on:
  push:
    branches: [master]
    # T6220: UNION of both halves' paths, identical in deploy-frontend.yml and
    # deploy-backend.yml. The invariant that matters is "bundle build == backend
    # build", not "always deploy": a commit touching EITHER half deploys BOTH
    # halves from the same commit, so the two numbers move together. A push
    # touching neither path deploys NEITHER half, so both stay at the same
    # (older, still-equal) number -- still correct, with zero redundant CI for
    # the docs(plan)-only commits this repo makes constantly.
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
  # T6220 known hole (documented, not fixed): a manual workflow_dispatch run
  # still fires ONLY this workflow, so a deliberate single-half manual dispatch
  # breaks lockstep on purpose. That is an operator's call, not a bug.
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      # Tbug40p: fetch-depth 0 so `git rev-list --count HEAD` returns the true
      # monotonic build number (a shallow clone would count only 1 commit).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy with commit sha + monotonic build number
        working-directory: src/backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_BUILD=$(git rev-list --count HEAD)
          flyctl deploy --config fly.staging.toml \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg APP_BUILD="$APP_BUILD"
