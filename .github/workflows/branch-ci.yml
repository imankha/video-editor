name: Branch CI

# Independent verification of every feature branch: converts "the worker says
# tests pass" into "GitHub says tests pass". Runs unit tests + changed-file
# lint on the layers the branch actually touched (T6405 -- see the `changes`
# job; a layer the diff cannot reach is skipped, but a layer it CAN reach runs
# its suite IN FULL; T13950: frontend vitest is import-graph scoped and T13960: backend pytest is
# testmon scoped, see their steps). T13710: scripts/ci_policy.py routes each path to the job that
# executes, imports or parses it; a path no rule claims fails `changes` loudly.
# Known pre-existing failures are catalogued in
# docs/testing/known-failures.md -- keep the deselect list below in sync.

on:
  push:
    branches: ['feature/**', 'integration/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      instructions: ${{ steps.filter.outputs.instructions }}
      tooling: ${{ steps.filter.outputs.tooling }}
      shrink: ${{ steps.filter.outputs.shrink }}
      landing: ${{ steps.filter.outputs.landing }}
      harness: ${{ steps.filter.outputs.harness }}
      required: ${{ steps.filter.outputs.required }}
      base: ${{ steps.filter.outputs.base }}
      head: ${{ steps.filter.outputs.head }}
      vitest_mode: ${{ steps.filter.outputs.vitest_mode }}
      vitest_files: ${{ steps.filter.outputs.vitest_files }}
      vitest_full_because: ${{ steps.filter.outputs.vitest_full_because }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture immutable revisions and required checks
        id: filter
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin master --quiet
          BASE_SHA=$(git rev-parse origin/master)
          python scripts/ci_policy.py route --base "$BASE_SHA" --head "$HEAD_SHA" --output routing-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: routing-manifest
          path: routing-manifest.json
          if-no-files-found: error
          overwrite: true

  instructions:
    needs: changes
    if: needs.changes.outputs.instructions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/audit-agent-instructions.py
      - name: Validate agent metadata and changed instruction links
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
        run: python scripts/validate_agent_instructions.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: python scripts/test_audit_agent_instructions.py
      - run: python scripts/test_validate_agent_instructions.py

  tooling:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_ci_policy.py
      - run: python scripts/test_ci_vitest_selection.py
      - run: python scripts/test_ci_testmon_selection.py
      - name: Testmon baseline helpers need pytest + coverage (versions match src/backend)
        run: python -m pip install pytest==8.3.4 pytest-testmon==2.2.0
      - run: python scripts/test_testmon_baseline.py
      - run: python scripts/test_landing_gate.py
      - run: python scripts/test_check_doc_drift.py
      - run: python scripts/test_split_pytest.py
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Doc drift (instruction/knowledge docs must name files and symbols that exist)
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
        run: python scripts/check_doc_drift.py --base "$BASE_SHA" --head "$HEAD_SHA"

  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax floor for hand-run scripts, hooks and skill helpers (they have no suite)
        run: |
          git ls-files -z 'scripts/*.py' '.claude/skills/*.py' ':!scripts/shrink-tool/*' ':!scripts/shrink-spike/*' | xargs -0 -r python -m py_compile
          git ls-files -z '*.sh' '.githooks/*' ':!src/*' | xargs -0 -r -n1 bash -n
          git ls-files -z '.claude/hooks/*.cjs' 'scripts/*.js' 'scripts/*.mjs' ':!scripts/shrink-tool/*' ':!scripts/shrink-spike/*' | xargs -0 -r -n1 node --check
      # Explicit list (ci_policy.SCRIPT_TESTS), never a scripts/test_* glob: a test_ prefix
      # once hid a script that sends real email.
      - name: Install the one third-party import the harness tests need (reset_all_accounts.py)
        run: python -m pip install psycopg2-binary==2.9.10
      - run: python scripts/test_dotask_cli.py
      - run: python scripts/test_dotask_evidence.py
      - run: python scripts/test_dotask_expert_matrix.py
      - run: python scripts/test_wave_profile.py
      - run: python scripts/test_reset_all_accounts.py
      - run: python scripts/test_lint_hook.py
      - run: bash scripts/test_task_run.sh

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/landing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (the command deploy-landing.yml ships; pulls @editor modules from src/frontend)
        run: npm run build

  shrink:
    needs: changes
    if: needs.changes.outputs.shrink == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/shrink-tool
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/shrink-tool/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run

  ci-ready:
    if: always()
    needs: [changes, instructions, tooling, frontend, backend, shrink, landing, harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every applicable job to succeed
        env:
          REQUIRED: ${{ needs.changes.outputs.required }}
          OUTCOMES: ${{ toJSON(needs) }}
        run: python scripts/ci_policy.py aggregate --required "$REQUIRED" --outcomes "$OUTCOMES"

  frontend:
    env:
      BASE_SHA: ${{ needs.changes.outputs.base }}
      HEAD_SHA: ${{ needs.changes.outputs.head }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: ESLint (changed files vs master)
        run: |
          # T11070: pathspecs anchored with :(top); unanchored they resolved
          # relative to src/frontend, matched nothing, and linted nothing. '*.js'
          # (not '**/*.js') so top-level files like vite.config.js count too.
          git diff --diff-filter=ACMRT --name-only -z "$BASE_SHA...$HEAD_SHA" -- ':(top)src/frontend/*.js' ':(top)src/frontend/*.jsx' |
            sed -z 's|^src/frontend/||' | xargs -0 -r npx eslint --no-warn-ignored
      - name: ESLint regression gate (whole src must not regrow the backlog)
        # T4790: froze the eslint backlog at 0 errors / 1019 warnings. Any new
        # error, or warnings past the baseline, fails the branch. Ratchet these
        # numbers DOWN as the warning backlog is cleared; never up.
        # T5030: ratcheted down to 998 (burned React imports + dead local vars).
        # T5580: enabled react/jsx-uses-vars so JSX-only imports stop false-
        # flagging as no-unused-vars; that cleared ~635 phantom warnings -> 360.
        run: npx eslint src --max-warnings 360
      - name: Viewport-unit gate (T4930 — no h-screen/100vh in the app tree)
        # Blocks the emulator-invisible iOS 100vh-vs-100dvh failure mode at the
        # source (root cause of T4880). Bans h-screen/100vh in src/frontend/src in
        # favor of h-dvh/100dvh; native-fullscreen CSS is exempt and pre-existing
        # occurrences are a tracked, ratcheting KNOWN_DEBT list in the script.
        working-directory: .
        run: node scripts/check-viewport-units.mjs
      - name: Media-api-base gate (T5890 — no bare /api/ media URL in the app tree)
        # Blocks the split-host-invisible poster/media loss that caused T5890: a bare
        # `/api/...` <img src>/media URL resolves against the Cloudflare Pages origin
        # on staging/prod and returns the SPA shell instead of the file. The Vite dev
        # proxy masks it locally, so it must be blocked at the source. Requires
        # `${API_BASE}/api/...`; test fixtures are exempt (never a real browser src).
        working-directory: .
        run: node scripts/check-media-api-base.mjs
      - name: Unit tests (vitest, retry absorbs known flakes)
        # T13950: only tests the changed files reach through Vite's module graph, plus tests
        # that read sources at runtime; anything the graph cannot see runs the full suite
        # (ci_policy.vitest_selection). Master CI always runs the full suite.
        env:
          VITEST_MODE: ${{ needs.changes.outputs.vitest_mode }}
          VITEST_FILES: ${{ needs.changes.outputs.vitest_files }}
          VITEST_FULL_BECAUSE: ${{ needs.changes.outputs.vitest_full_because }}
        run: |
          case "$VITEST_MODE" in
            related)
              echo "vitest related inputs:"
              node -e 'for (const f of JSON.parse(process.env.VITEST_FILES)) console.log("  " + f)'
              node -e 'process.stdout.write(JSON.parse(process.env.VITEST_FILES).join("\0"))' |
                xargs -0 npx vitest related --run --retry=2 --passWithNoTests ;;
            full)
              echo "Full suite; the module graph cannot see: $VITEST_FULL_BECAUSE"
              npx vitest run --retry=2 ;;
            *)
              echo "::error::unexpected vitest_mode '$VITEST_MODE' for a job that frontend routing requires"
              exit 1 ;;
          esac
  # T13964: backend = backend-lint (ruff + import check, once) + backend-shard (pytest split 4 ways
  # by recorded per-file duration, scripts/split_pytest.py) + this aggregate, the one check ci-ready
  # and the landing gate require. It fails unless lint and every shard succeeded AND the shard
  # reports prove each input test file ran exactly once.
  backend:
    needs: [changes, backend-lint, backend-shard]
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint and every shard succeeded
        env:
          LINT_RESULT: ${{ needs.backend-lint.result }}
          SHARD_RESULT: ${{ needs.backend-shard.result }}
        run: |
          echo "backend-lint: $LINT_RESULT, backend-shard: $SHARD_RESULT"
          if [ "$LINT_RESULT" != success ] || [ "$SHARD_RESULT" != success ]; then
            echo "::error::backend needs backend-lint and every backend-shard to succeed"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-report-*
          path: shard-reports
      - name: Every shard reported and every input test file ran exactly once
        working-directory: src/backend
        run: python ../../scripts/split_pytest.py verify --shards "$SHARDS" --reports-dir ../../shard-reports tests/test_*.py

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      BASE_SHA: ${{ needs.changes.outputs.base }}
      HEAD_SHA: ${{ needs.changes.outputs.head }}
      APP_ENV: dev
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - name: Install deps (the import check needs the prod requirements)
        run: pip install -r requirements.prod.txt ruff
      - name: Ruff (changed files vs master)
        # T11070: per-file ratchet. The old inline step's pathspec was resolved
        # relative to src/backend, matched nothing, and silently linted nothing.
        run: bash ../../scripts/ci_ruff_changed.sh
      - name: Ruff regression gate (whole app must not regrow the backlog)
        # T4790: froze the ruff backlog at 261 errors (all remaining are
        # unsafe-autofix or manual-only rules; see the T4790 report). Fail if the
        # count grows. Ratchet the baseline DOWN as the remainder is cleared.
        # T5020: ratcheted to 239. NOTE: 5 SIM118 warnings in clips.py,
        # overlay.py, games_upload.py are kept as x.keys() -- ruff's suggested
        # rewrite is a bug for sqlite3.Row (in row checks VALUES, not column
        # names). See tests/test_sqlite_row_membership.py for proof.
        run: |
          OUT=$(ruff check app --output-format=concise || true)
          COUNT=$(printf '%s\n' "$OUT" | grep -c '^app/' || true)
          echo "ruff error count: $COUNT (baseline 239)"
          if [ "$COUNT" -gt 239 ]; then
            echo "::error::ruff errors grew past the T5020 baseline of 239 (now $COUNT). Fix the new errors or lower the baseline only if you reduced the backlog."
            exit 1
          fi
      - name: Import check
        run: python -c "from app.main import app"

  backend-shard:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # pg_conn fixture creates schema + runs migrations itself on this
      # disposable DB, and its staging/prod DSN guard passes ("ci_test").
      BASE_SHA: ${{ needs.changes.outputs.base }}
      HEAD_SHA: ${{ needs.changes.outputs.head }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      APP_ENV: dev
      PYTHONUTF8: '1'
      SHARD: ${{ matrix.shard }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - name: Install ffmpeg (metadata tests use ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install deps
        # T5020: starlette 0.37.2 dropped the httpx-removed `app=` TestClient kwarg,
        # so tests run on the SAME httpx 0.28.1 as prod -- no `httpx<0.28` override.
        run: pip install -r requirements.prod.txt -r requirements.test.txt
      - name: Restore the Master CI testmon baseline (T13962)
        uses: actions/cache/restore@v4
        with:
          path: |
            src/backend/.testmondata
            src/backend/.testmondata-sha
            src/backend/always_run.json
            src/backend/import_lines.json
          key: testmon-${{ needs.changes.outputs.base }}
          restore-keys: testmon-
      - name: Plan the pytest run (selected test files or full suite)
        id: pytest_plan
        working-directory: .
        run: python scripts/ci_policy.py pytest-plan --base "$BASE_SHA" --head "$HEAD_SHA" --baseline-dir src/backend --output pytest-plan.json
      - name: Pytest, this shard's files (deselects = docs/testing/known-failures.md)
        # selection mirrors run_tests.py (canonical suite); tests/integration is not part of it; pytest tests/ hits a capture-closing internal error - root-cause tracked in T5000
        # T13962: testmon is only the SELECTOR. It lists the tests whose recorded coverage touches
        # the change; we run plain pytest once on those whole FILES plus always_run.json (tests that
        # spawn processes), which covers module-scoped fixtures and per-module caches. Anything
        # testmon cannot see (import-time code, cached bodies, non-Python inputs, schema/migrations,
        # conftest, deleted modules, no baseline) runs the full suite (ci_policy.pytest_plan).
        # Master CI always runs the full suite and is the backstop for the residual risk.
        # T13964: every shard computes the same input list (same plan, same baseline) and runs its
        # slice of it; the backend job verifies the shard reports add up to that list.
        env:
          PYTEST_MODE: ${{ steps.pytest_plan.outputs.mode }}
          ALWAYS_RUN: ${{ steps.pytest_plan.outputs.always_run }}
        run: |
          case "$PYTEST_MODE" in
            testmon)
              code=0
              python -m pytest --testmon --testmon-nocollect --collect-only -q tests/test_*.py > testmon-select.log 2>&1 || code=$?
              if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then cat testmon-select.log; echo "::error::testmon selection failed (exit $code)"; exit 1; fi
              if grep -q "All tests have to be re-executed" testmon-select.log; then
                echo "::warning::testmon reports an environment change (All tests have to be re-executed); every test file is selected"
              fi
              FILES=$(grep -oE '^tests/[A-Za-z0-9_]+\.py' testmon-select.log | sort -u | tr '\n' ' ')
              echo "Selected test files (whole files) + always-run: $FILES $ALWAYS_RUN"
              INPUT=$(printf '%s\n' $FILES $ALWAYS_RUN | sort -u | tr '\n' ' ') ;;
            full)
              INPUT=$(echo tests/test_*.py) ;;
            *)
              echo "::error::unexpected pytest mode '$PYTEST_MODE' for a job that backend routing requires"
              exit 1 ;;
          esac
          MINE=$(python ../../scripts/split_pytest.py shard --index "$SHARD" --shards "$SHARDS" --durations tests/.test_durations.json --mode "$PYTEST_MODE" --report shard-report.json $INPUT)
          if [ -z "$MINE" ]; then
            echo "Shard $SHARD/$SHARDS has no test files in this plan"
          else
            echo "Shard $SHARD/$SHARDS runs: $MINE"
            python -m pytest $MINE --tb=short --capture=sys
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backend-shard-report-${{ matrix.shard }}
          path: src/backend/shard-report.json
          if-no-files-found: error
          overwrite: true
