name: Deploy Landing

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/landing/**'

jobs:
  deploy-landing:
    name: Deploy Landing to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: src/landing

      - run: npm run build
        working-directory: src/landing

      - run: npx wrangler deploy
        working-directory: src/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Ping IndexNow (Bing, Yandex, et al.) with the freshly deployed URLs.
      # Runs after deploy so the pages are live; never fails the build.
      - run: node scripts/indexnow-submit.mjs
        working-directory: src/landing
        continue-on-error: true
